tianyi_replay:
  ros__parameters:
    config.profile_path: "config/tianyi/replay/left_camera_profile.yaml"
    config.execution.mode: single
    config.execution.enable_timing: true

    config.main.image_decode_mode: async
    config.main.image_is_compress: false
    config.main.image_color_topic_name: "camera/color/image_raw"
    config.main.image_depth_topic_name: "camera/depth/image_raw"

    config.policy.episode_path: ""

    config.record.ask_before_save: true
    config.record.ask_before_next_episode: true
    config.record.flush_policy: finalize
    config.record.write_chunk_rows: 512
    config.record.max_steps: 6000
    config.record.buffer_warn_bytes: 268435456
    config.record.compress_method: gzip

    config.action.name: "~/run"
    config.action.feedback_period: 1.0
