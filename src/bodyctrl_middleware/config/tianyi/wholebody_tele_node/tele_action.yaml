tianyi_whole_tele:
  ros__parameters:
    config.profile_path: "config/tianyi/wholebody_tele.yaml"

    config.arm.image_decode_mode: "async"
    config.arm.image_is_compress: false
    config.arm.image_depth_topic_name: "camera/depth/image_raw"
    config.arm.image_color_topic_name: "camera/color/image_raw"

    config.debug_timing: true
    config.policy.policy_type: tele

    config.action.name: "~/run"
    config.action.feedback_period: 1.0
