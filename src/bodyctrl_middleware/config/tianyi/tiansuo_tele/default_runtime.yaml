tianyi_tiansuo_runtime:
  ros__parameters:
    config.profile_path: "config/tianyi/tiansuo_tele/bimanual_camera_profile.yaml"
    config.execution.mode: single
    config.execution.enable_timing: true

    config.tele_tiansuo.reset_timeout: 120.0
    config.record.ask_before_save: true
    config.record.ask_before_next_episode: true
    config.record.flush_policy: finalize
    config.record.write_chunk_rows: 512
    config.record.max_steps: 6000
    config.record.buffer_warn_bytes: 268435456
    config.record.compress_method: gzip
    config.record.confirm_timeout: 120.0
    config.record.confirm_on_unavailable: keep
    config.record.stop_before_confirm: true
