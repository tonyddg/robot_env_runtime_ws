name: robot-env-runtime-ws

services:
  ros2-dev:
    build:
      context: ..
      dockerfile: docker/ros2ws.Dockerfile
      args:
        USERNAME: ros
        USER_UID: 1000
        USER_GID: 1000

    container_name: robot-env-runtime-ws

    network_mode: host
    ipc: host

    stdin_open: true
    tty: true

    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"

      ROS_DOMAIN_ID: "0"
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp

      # 明确指定 HOME，避免之前 /.ros/log 的问题
      HOME: /home/ros

    volumes:
      # X11 GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # 将整个项目根目录映射到 /app
      - ..:/app:rw
      
      # 不让宿主机的项目目录覆盖容器里的 .venv, 将 venv 保存到内部 Volumes 中
      - app-venv:/app/.venv

    working_dir: /ros2_ws
    command: bash

# 创建保存 venv 到 Volumes
volumes:
  app-venv: